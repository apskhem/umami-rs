[workspace]
resolver = "3"
members = ["umami-db", "umami-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

# Upstream Umami release this server is compatible with (schema + API).
[workspace.metadata.umami]
version = "3.4.1"

[workspace.dependencies]
umami-db = { path = "umami-db" }

anyhow = "1.0.104"
axum = "0.8.9"
dotenvy = "0.15.7"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4"] }

# Dev-only
http-body-util = "0.1.5"
