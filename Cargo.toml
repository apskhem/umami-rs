[workspace]
resolver = "3"
members = ["parity", "umami-db", "umami-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

# Upstream Umami release this server is compatible with (schema + API).
[workspace.metadata.umami]
version = "3.4.1"

[workspace.dependencies]
umami-db = { path = "umami-db" }
umami-server = { path = "umami-server" }

aes-gcm = "0.11.1"
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
bcrypt = "0.19.3"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
dotenvy = "0.15.7"
fancy-regex = "0.20.0"
getrandom = "0.4.3"
hex = "0.4.3"
ipnet = "2.12.2"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
maxminddb = "0.32.0"
mimalloc = "0.1.52"
pbkdf2 = "0.13.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4", "v5", "v7", "serde"] }

# Dev-only
http-body-util = "0.1.5"

# Production builds (`cargo build --release` and the Docker image): maximum runtime
# performance and smallest binary, at the cost of slower builds. `panic` stays
# "unwind" so a panicking request handler fails that request, not the whole server.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
