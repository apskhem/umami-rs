# Local Postgres for development and the ignored DB tests.
#   docker compose up -d
#   TEST_DATABASE_URL=postgresql://umami:umami@localhost:5432/umami cargo test -- --include-ignored
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: umami
      POSTGRES_DB: umami
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
